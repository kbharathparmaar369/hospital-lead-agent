<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Voice Agent Embed Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    .container {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    iframe {
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hospital Voice Receptionist</h2>
    <p>Click below to start speaking with the agent:</p>
    <!-- allow="microphone" is required by browsers to capture voice inside iframes -->
    <iframe
      src="http://localhost:3000/embed?theme=dark"
      style="width: 360px; height: 500px;"
      allow="microphone"
    ></iframe>
  </div>
</body>
</html>
